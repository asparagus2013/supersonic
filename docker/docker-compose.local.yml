services:
  app:
    image: supersonic-local:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile.local
    environment:
      S2_DB_TYPE: mysql
      S2_DB_HOST: host.docker.internal
      S2_DB_PORT: 3306
      S2_DB_DATABASE: ${S2_DB_DATABASE:?Set S2_DB_DATABASE}
      S2_DB_USER: ${S2_DB_USER:?Set S2_DB_USER}
      S2_DB_PASSWORD: ${S2_DB_PASSWORD:?Set S2_DB_PASSWORD}
    ports:
      - "127.0.0.1:9080:9080"
    volumes:
      - app_logs:/app/logs
    restart: "no"
volumes:
  app_logs:
